events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    upstream backend  { server backend:8000; }
    upstream frontend { server frontend:3000; }

    # Um upgrade para WebSocket precisa ser repassado tal e qual; uma requisição
    # normal NÃO pode sair daqui com "Connection: upgrade". O map resolve os dois
    # casos a partir do mesmo cabeçalho, em vez de fixar "upgrade" para todos.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 20M;

        # As atualizações ao vivo e o mapa da fábrica falam WebSocket sob /api/.
        # Precisam de blocos próprios: o /api/ abaixo não faz o upgrade — então o
        # handshake voltava como HTTP e o socket nunca abria — e corta a conexão
        # em 60 s, o que fecharia o socket a cada minuto mesmo se abrisse.
        location /api/live/ws {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
        }

        location /api/factory-map/ws/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
        }

        # API REST
        location /api/ {
            proxy_pass         http://backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        # WebSocket (IoT / alertas em tempo real)
        location /ws {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_read_timeout 3600s;
        }

        # Documentação FastAPI (Swagger UI)
        location /docs {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        # Documentação FastAPI (ReDoc)
        location /redoc {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        # Schema OpenAPI JSON
        location /openapi.json {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        # Frontend React. Em dev o Vite serve o HMR por WebSocket na própria raiz
        # (vite.config.ts fixa clientPort: 80 dentro do container), então este
        # bloco também precisa repassar o upgrade — sem isso o HMR não conecta e
        # o Vite cai no recarregamento da página inteira, em laço. O timeout é
        # longo porque um socket de HMR fica em silêncio entre duas edições.
        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
        }
    }
}
