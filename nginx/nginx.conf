events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    upstream backend  { server backend:8000; }
    upstream frontend { server frontend:3000; }

    # A WebSocket upgrade has to be passed through as is; a normal request must
    # NOT leave here with "Connection: upgrade". The map resolves both cases
    # from the same header instead of hardcoding "upgrade" for everyone.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 20M;

        # Live updates and the factory map speak WebSocket under /api/. They
        # need their own blocks: the /api/ block below does not do the upgrade —
        # so the handshake came back as plain HTTP and the socket never opened —
        # and it cuts the connection after 60 s, which would close the socket
        # every minute even if it did open.
        location /api/live/ws {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
        }

        location /api/factory-map/ws/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
        }

        # REST API
        location /api/ {
            proxy_pass         http://backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        # WebSocket (IoT / real-time alerts)
        location /ws {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_read_timeout 3600s;
        }

        # FastAPI docs (Swagger UI)
        location /docs {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        # FastAPI docs (ReDoc)
        location /redoc {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        # OpenAPI JSON schema
        location /openapi.json {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        # React frontend. In dev, Vite serves HMR over a WebSocket on the root
        # itself (vite.config.ts pins clientPort: 80 inside the container), so
        # this block must pass the upgrade through too — without it HMR cannot
        # connect and Vite falls back to reloading the whole page, in a loop. The
        # timeout is long because an HMR socket stays silent between two edits.
        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
        }
    }
}
