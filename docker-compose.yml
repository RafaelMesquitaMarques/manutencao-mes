# Pinned so volumes/containers stay under the original project name
# even though the folder is now C:\KAIZO (was Z:\manutencao-mes\manutencao-mes).
# This preserves the existing data volumes (manutencao-mes_db_data, etc.).
name: manutencao-mes

services:

  # ─── Main database ──────────────────────────────────────────────────────────
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: mes_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-manutencao}
      POSTGRES_USER: ${DB_USER:-mesadmin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mesadmin}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Cache and queues ───────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: mes_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─── MQTT broker (IoT sensors) ──────────────────────────────────────────────
  mqtt:
    image: eclipse-mosquitto:2
    container_name: mes_mqtt
    restart: unless-stopped
    volumes:
      - mqtt_data:/mosquitto/data
    ports:
      - "1883:1883"
      - "9001:9001"

  # ─── Backend API (FastAPI) ───────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mes_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-mesadmin}:${DB_PASSWORD:-changeme}@db:5432/${DB_NAME:-manutencao}
      REDIS_URL: redis://redis:6379
      MQTT_BROKER: mqtt
      MQTT_PORT: 1883
      SECRET_KEY: ${SECRET_KEY:-change-this-key-in-production}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      # Public URL of the app (cloudflared tunnel / reverse proxy) — enables
      # the "I'm on it" ack link in escalation SMS. Empty = no link.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # Ask Ninja + note organizing. Empty = calculator-only replies and plain
      # local formatting for dictated notes (the app keeps working).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Premium Ask Ninja voice (optional). Empty = browser voices only.
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-pNInz6obpgDQGcFmaJgB}
      # Yokogawa Sushi Sensor LoRaWAN ingest — the network server's HTTP
      # integration authenticates with this token (X-Ingest-Token header).
      # SUSHI_BYTE_ORDER flips the payload decoder if the big-endian
      # assumption proves wrong on real hardware (see docs/sushi-sensor-contract.md).
      SUSHI_INGEST_TOKEN: ${SUSHI_INGEST_TOKEN:-}
      SUSHI_BYTE_ORDER: ${SUSHI_BYTE_ORDER:-big}
      # Cortex INBOUND push (/api/v1/cortex/events — OF reads by cobot).
      # Empty = endpoint disabled (503). Accepts several comma-separated tokens
      # (rotation without downtime); each environment sets its own in .env.
      CORTEX_INGEST_TOKEN: ${CORTEX_INGEST_TOKEN:-}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  # ─── IoT alert worker (consumes MQTT, writes to TimescaleDB) ─────────────────
  iot_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mes_iot_worker
    restart: unless-stopped
    command: python -m app.workers.iot_consumer
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-mesadmin}:${DB_PASSWORD:-changeme}@db:5432/${DB_NAME:-manutencao}
      REDIS_URL: redis://redis:6379
      MQTT_BROKER: mqtt
      MQTT_PORT: 1883
    depends_on:
      - backend
      - mqtt

  # ─── ADAM gateway (reads the Advantech modules over Modbus/TCP, feeds the API) ───
  # A single service reads the WHOLE ADAM fleet (adam_devices table) and pushes
  # to the /production-count and /production-signal endpoints. Each device's
  # config and health live in the database (/settings/devices screen).
  # NETWORK: this container needs a Modbus/TCP route (port 502) to the ADAMs on
  # the shop floor. If the ADAMs are not reachable from the Docker bridge, run
  # this service with `network_mode: host` (Linux) or make sure there is
  # routing/VLAN between the server and the machines' network.
  adam_gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mes_adam_gateway
    restart: unless-stopped
    command: python -m app.workers.adam_gateway
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-mesadmin}:${DB_PASSWORD:-changeme}@db:5432/${DB_NAME:-manutencao}
      ADAM_API_BASE: http://backend:8000
      ADAM_RELOAD_SEC: ${ADAM_RELOAD_SEC:-10}
    depends_on:
      - backend
      - db

  # ─── Cortex poller (pulls the end-of-line scans from the Cortex API) ──────────
  # The assembly lines (assemblage) take their QUANTITIES from the label scanned
  # on each finished piece of furniture as it leaves the line. This service PULLS
  # the new scans from the Cortex API (cortex_stations table: station → line,
  # /settings/devices screen) and sends each one to
  # /api/machines/{ref}/of-unit-scan (+1 on the OF + production).
  # CORTEX_API_BASE/CORTEX_API_KEY come from .env — without them the stations
  # show an error on the devices screen until the integration is configured.
  cortex_poller:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mes_cortex_poller
    restart: unless-stopped
    command: python -m app.workers.cortex_poller
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-mesadmin}:${DB_PASSWORD:-changeme}@db:5432/${DB_NAME:-manutencao}
      KAIZO_API_BASE: http://backend:8000
      CORTEX_API_BASE: ${CORTEX_API_BASE:-}
      CORTEX_API_KEY: ${CORTEX_API_KEY:-}
      CORTEX_RELOAD_SEC: ${CORTEX_RELOAD_SEC:-10}
    depends_on:
      - backend
      - db

  # ─── React frontend ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mes_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: /api
      VITE_WS_URL: ws://localhost/ws
    depends_on:
      - backend

  # ─── Reverse proxy ───────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: mes_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    command: |
      /bin/sh -c "cat > /etc/nginx/nginx.conf << 'NGINXCONF'
      events { worker_connections 1024; }
      http {
        upstream backend { server backend:8000; }
        upstream frontend { server frontend:3000; }
        server {
          listen 80;
          client_max_body_size 250M;
          location /api/ { proxy_pass http://backend/api/; proxy_set_header Host $$host; proxy_http_version 1.1; proxy_set_header Upgrade $$http_upgrade; proxy_set_header Connection $$http_connection; proxy_read_timeout 3600s; }
          location /docs { proxy_pass http://backend/docs; }
          location /openapi.json { proxy_pass http://backend/openapi.json; }
          location / { proxy_pass http://frontend/; proxy_set_header Host $$host; proxy_set_header Upgrade $$http_upgrade; proxy_set_header Connection upgrade; }
        }
      }
      NGINXCONF
      nginx -g 'daemon off;'"
    depends_on:
      - backend
      - frontend

  # ─── Automatic daily backup ──────────────────────────────────────────────────
  # Dumps go to ./backups/{last,daily,weekly,monthly} on the host (gitignored),
  # outside Docker's disk. ./backups must be on a LOCAL drive: Docker Desktop
  # cannot bind-mount a mapped network drive, the folder shows up read-only and
  # the container restart-loops on "BACKUP_DIR ... insufficient permissions"
  # (happened while the stack still ran from Z:\). Recreate this service
  # whenever the checkout moves: `docker compose up -d --no-deps backup`.
  # Tag = the db's PostgreSQL major (pg_dump 18 output does not restore cleanly
  # into 16, e.g. `SET transaction_timeout`) — bump both together.
  backup:
    image: prodrigestivill/postgres-backup-local:16
    container_name: mes_backup
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${DB_NAME:-manutencao}
      POSTGRES_USER: ${DB_USER:-mesadmin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 30
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  redis_data:
  mqtt_data:
  uploads_data:
