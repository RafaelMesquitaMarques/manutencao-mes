# Pinned so volumes/containers stay under the original project name
# even though the folder is now C:\KAIZO (was Z:\manutencao-mes\manutencao-mes).
# This preserves the existing data volumes (manutencao-mes_db_data, etc.).
name: manutencao-mes

services:

  # ─── Banco de dados principal ───────────────────────────────────────────────
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: mes_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-manutencao}
      POSTGRES_USER: ${DB_USER:-mesadmin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mesadmin}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Cache e filas ──────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: mes_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─── Broker MQTT (captores IoT) ─────────────────────────────────────────────
  mqtt:
    image: eclipse-mosquitto:2
    container_name: mes_mqtt
    restart: unless-stopped
    volumes:
      - mqtt_data:/mosquitto/data
    ports:
      - "1883:1883"
      - "9001:9001"

  # ─── Backend API (FastAPI) ───────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mes_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-mesadmin}:${DB_PASSWORD:-changeme}@db:5432/${DB_NAME:-manutencao}
      REDIS_URL: redis://redis:6379
      MQTT_BROKER: mqtt
      MQTT_PORT: 1883
      SECRET_KEY: ${SECRET_KEY:-troque-esta-chave-em-producao}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      # Public URL of the app (cloudflared tunnel / reverse proxy) — enables
      # the "I'm on it" ack link in escalation SMS. Empty = no link.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Premium Ask Ninja voice (optional). Empty = browser voices only.
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-pNInz6obpgDQGcFmaJgB}
      # Note organizing: primary = Anthropic API (fast) when ANTHROPIC_API_KEY is
      # set; the Ollama vars point at the token-free offline fallback. Empty
      # OLLAMA_BASE_URL disables that fallback (local formatting when the API fails).
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      # Yokogawa Sushi Sensor LoRaWAN ingest — the network server's HTTP
      # integration authenticates with this token (X-Ingest-Token header).
      # SUSHI_BYTE_ORDER flips the payload decoder if the big-endian
      # assumption proves wrong on real hardware (see docs/sushi-sensor-contract.md).
      SUSHI_INGEST_TOKEN: ${SUSHI_INGEST_TOKEN:-}
      SUSHI_BYTE_ORDER: ${SUSHI_BYTE_ORDER:-big}
      # Cortex INBOUND push (/api/v1/cortex/events — leituras de OF por cobot).
      # Vazio = endpoint desabilitado (503). Aceita vários tokens separados por
      # vírgula (rotação sem downtime); cada ambiente define o seu no .env.
      CORTEX_INGEST_TOKEN: ${CORTEX_INGEST_TOKEN:-}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  # ─── Worker de alertas IoT (consome MQTT, grava TimescaleDB) ─────────────────
  iot_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mes_iot_worker
    restart: unless-stopped
    command: python -m app.workers.iot_consumer
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-mesadmin}:${DB_PASSWORD:-changeme}@db:5432/${DB_NAME:-manutencao}
      REDIS_URL: redis://redis:6379
      MQTT_BROKER: mqtt
      MQTT_PORT: 1883
    depends_on:
      - backend
      - mqtt

  # ─── Gateway ADAM (lê os módulos Advantech por Modbus/TCP e alimenta a API) ───
  # Um único serviço lê TODA a frota de ADAMs (tabela adam_devices) e faz push
  # para os endpoints /production-count e /production-signal. Config e saúde de
  # cada dispositivo vivem no banco (tela /settings/devices).
  # REDE: este container precisa de rota Modbus/TCP (porta 502) até os ADAMs no
  # chão de fábrica. Se os ADAMs não forem alcançáveis a partir da bridge do
  # Docker, rode este serviço com `network_mode: host` (Linux) ou garanta o
  # roteamento/VLAN entre o servidor e a rede das máquinas.
  adam_gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mes_adam_gateway
    restart: unless-stopped
    command: python -m app.workers.adam_gateway
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-mesadmin}:${DB_PASSWORD:-changeme}@db:5432/${DB_NAME:-manutencao}
      ADAM_API_BASE: http://backend:8000
      ADAM_RELOAD_SEC: ${ADAM_RELOAD_SEC:-10}
    depends_on:
      - backend
      - db

  # ─── Poller Cortex (puxa os scans de fim de linha da API do Cortex) ───────────
  # As linhas de montagem (assemblage) tiram as QUANTIDADES da etiqueta escaneada
  # em cada móvel pronto na saída da linha. Este serviço PUXA os scans novos da
  # API do Cortex (tabela cortex_stations: estação → linha, tela /settings/devices)
  # e envia cada um para /api/machines/{ref}/of-unit-scan (+1 no OF + produção).
  # CORTEX_API_BASE/CORTEX_API_KEY vêm do .env — sem eles as estações aparecem em
  # erro na tela de devices até a integração ser configurada.
  cortex_poller:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mes_cortex_poller
    restart: unless-stopped
    command: python -m app.workers.cortex_poller
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-mesadmin}:${DB_PASSWORD:-changeme}@db:5432/${DB_NAME:-manutencao}
      KAIZO_API_BASE: http://backend:8000
      CORTEX_API_BASE: ${CORTEX_API_BASE:-}
      CORTEX_API_KEY: ${CORTEX_API_KEY:-}
      CORTEX_RELOAD_SEC: ${CORTEX_RELOAD_SEC:-10}
    depends_on:
      - backend
      - db

  # ─── LLM local (Ollama) — fallback offline do organizador de notas ────────────
  # Caminho primário é a API da Anthropic (ANTHROPIC_API_KEY no backend); este
  # serviço só atende quando a API falha/está sem internet. Modelo roda on-prem,
  # sem custo por token. Após subir, baixe o modelo uma vez:
  #   docker compose exec ollama ollama pull llama3.2
  # Sem GPU funciona (lento em CPU). Se este serviço estiver fora do ar, as notas
  # recebem apenas formatação local básica quando a API falhar (o app continua).
  ollama:
    image: ollama/ollama:latest
    container_name: mes_ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    # Descomente para acelerar com GPU NVIDIA (requer nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ─── Frontend React ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mes_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: /api
      VITE_WS_URL: ws://localhost/ws
    depends_on:
      - backend

  # ─── Proxy reverso ───────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: mes_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    command: |
      /bin/sh -c "cat > /etc/nginx/nginx.conf << 'NGINXCONF'
      events { worker_connections 1024; }
      http {
        upstream backend { server backend:8000; }
        upstream frontend { server frontend:3000; }
        server {
          listen 80;
          client_max_body_size 250M;
          location /api/ { proxy_pass http://backend/api/; proxy_set_header Host $$host; proxy_http_version 1.1; proxy_set_header Upgrade $$http_upgrade; proxy_set_header Connection $$http_connection; proxy_read_timeout 3600s; }
          location /docs { proxy_pass http://backend/docs; }
          location /openapi.json { proxy_pass http://backend/openapi.json; }
          location / { proxy_pass http://frontend/; proxy_set_header Host $$host; proxy_set_header Upgrade $$http_upgrade; proxy_set_header Connection upgrade; }
        }
      }
      NGINXCONF
      nginx -g 'daemon off;'"
    depends_on:
      - backend
      - frontend

  # ─── Backup automático diário ────────────────────────────────────────────────
  backup:
    image: prodrigestivill/postgres-backup-local
    container_name: mes_backup
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${DB_NAME:-manutencao}
      POSTGRES_USER: ${DB_USER:-mesadmin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 30
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  redis_data:
  mqtt_data:
  uploads_data:
  ollama_data: