# Pinned so volumes/containers stay under the original project name
# even though the folder is now C:\KAIZO (was Z:\manutencao-mes\manutencao-mes).
# This preserves the existing data volumes (manutencao-mes_db_data, etc.).
name: manutencao-mes

services:

  # ─── Banco de dados principal ───────────────────────────────────────────────
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: mes_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-manutencao}
      POSTGRES_USER: ${DB_USER:-mesadmin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mesadmin}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Cache e filas ──────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: mes_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─── Broker MQTT (captores IoT) ─────────────────────────────────────────────
  mqtt:
    image: eclipse-mosquitto:2
    container_name: mes_mqtt
    restart: unless-stopped
    volumes:
      - mqtt_data:/mosquitto/data
    ports:
      - "1883:1883"
      - "9001:9001"

  # ─── Backend API (FastAPI) ───────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mes_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-mesadmin}:${DB_PASSWORD:-changeme}@db:5432/${DB_NAME:-manutencao}
      REDIS_URL: redis://redis:6379
      MQTT_BROKER: mqtt
      MQTT_PORT: 1883
      SECRET_KEY: ${SECRET_KEY:-troque-esta-chave-em-producao}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      # Public URL of the app (cloudflared tunnel / reverse proxy) — enables
      # the "I'm on it" ack link in escalation SMS. Empty = no link.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  # ─── Worker de alertas IoT (consome MQTT, grava TimescaleDB) ─────────────────
  iot_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mes_iot_worker
    restart: unless-stopped
    command: python -m app.workers.iot_consumer
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-mesadmin}:${DB_PASSWORD:-changeme}@db:5432/${DB_NAME:-manutencao}
      REDIS_URL: redis://redis:6379
      MQTT_BROKER: mqtt
      MQTT_PORT: 1883
    depends_on:
      - backend
      - mqtt

  # ─── Gateway ADAM (lê os módulos Advantech por Modbus/TCP e alimenta a API) ───
  # Um único serviço lê TODA a frota de ADAMs (tabela adam_devices) e faz push
  # para os endpoints /production-count e /production-signal. Config e saúde de
  # cada dispositivo vivem no banco (tela /settings/devices).
  # REDE: este container precisa de rota Modbus/TCP (porta 502) até os ADAMs no
  # chão de fábrica. Se os ADAMs não forem alcançáveis a partir da bridge do
  # Docker, rode este serviço com `network_mode: host` (Linux) ou garanta o
  # roteamento/VLAN entre o servidor e a rede das máquinas.
  adam_gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mes_adam_gateway
    restart: unless-stopped
    command: python -m app.workers.adam_gateway
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-mesadmin}:${DB_PASSWORD:-changeme}@db:5432/${DB_NAME:-manutencao}
      ADAM_API_BASE: http://backend:8000
      ADAM_RELOAD_SEC: ${ADAM_RELOAD_SEC:-10}
    depends_on:
      - backend
      - db

  # ─── Frontend React ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mes_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: /api
      VITE_WS_URL: ws://localhost/ws
    depends_on:
      - backend

  # ─── Proxy reverso ───────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: mes_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    command: |
      /bin/sh -c "cat > /etc/nginx/nginx.conf << 'NGINXCONF'
      events { worker_connections 1024; }
      http {
        upstream backend { server backend:8000; }
        upstream frontend { server frontend:3000; }
        server {
          listen 80;
          client_max_body_size 250M;
          location /api/ { proxy_pass http://backend/api/; proxy_set_header Host $$host; proxy_http_version 1.1; proxy_set_header Upgrade $$http_upgrade; proxy_set_header Connection $$http_connection; proxy_read_timeout 3600s; }
          location /docs { proxy_pass http://backend/docs; }
          location /openapi.json { proxy_pass http://backend/openapi.json; }
          location / { proxy_pass http://frontend/; proxy_set_header Host $$host; proxy_set_header Upgrade $$http_upgrade; proxy_set_header Connection upgrade; }
        }
      }
      NGINXCONF
      nginx -g 'daemon off;'"
    depends_on:
      - backend
      - frontend

  # ─── Backup automático diário ────────────────────────────────────────────────
  backup:
    image: prodrigestivill/postgres-backup-local
    container_name: mes_backup
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${DB_NAME:-manutencao}
      POSTGRES_USER: ${DB_USER:-mesadmin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 30
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  redis_data:
  mqtt_data:
  uploads_data: